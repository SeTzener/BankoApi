<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Returning to Banko</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f6f6f8;
      --surface: #ffffff;
      --text: #15161a;
      --muted: #5c5f66;
      --accent: #2f6fed;
      --accent-text: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #101114;
        --surface: #1b1d22;
        --text: #f4f5f7;
        --muted: #a7abb5;
        --accent: #6f9bff;
        --accent-text: #0b1020;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    main {
      width: 100%;
      max-width: 360px;
      padding: 28px 24px;
      border-radius: 20px;
      background: var(--surface);
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.25rem;
      line-height: 1.3;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    a {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 28px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Returning to Banko&hellip;</h1>
    <p>Your bank connection is complete. If the app does not open automatically, tap the button below.</p>
    <a id="open-banko" href="banko://bank-auth-callback">Open Banko</a>
  </main>

  <script>
    (function () {
      var target = "banko://bank-auth-callback";

      // Embedded WebViews block a server-side redirect to a custom URL scheme,
      // but they allow a client-side navigation initiated by the page itself.
      // The link above remains as a manual fallback if this is blocked too.
      window.location.replace(target);
      window.setTimeout(function () {
        window.location.href = target;
      }, 500);
    })();
  </script>
</body>
</html>
